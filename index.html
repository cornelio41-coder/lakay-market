<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lakay Market 🇭🇹</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 5px;
      font-size: 14px;
    }

    .search {
      padding: 15px;
      background: white;
    }

    .search input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .categories {
      padding: 15px;
    }

    .categories h2 {
      margin-bottom: 12px;
    }

    .category-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }

    .category {
      min-width: 100px;
      background: white;
      padding: 15px 10px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .products {
      padding: 15px;
    }

    .products h2 {
      margin-bottom: 15px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 7px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .product-info {
      padding: 10px;
    }

    .product h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .location {
      font-size: 13px;
      color: #777;
      margin-bottom: 10px;
    }

    .contact {
      display: block;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 9px;
      text-align: center;
      border-radius: 7px;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      text-align: center;
      background: #111;
      color: white;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>🇭🇹 LAKAY MARKET</h1>
  <p>Achte lakay, vann lakay.</p>
</header>

<div class="search">
  <input type="text" placeholder="🔎 Rechercher un produit...">
</div>

<section class="categories">
  <h2>Catégories</h2>

  <div class="category-list">
    <div class="category">📱<br>Électronique</div>
    <div class="category">👕<br>Mode</div>
    <div class="category">🎨<br>Artisanat</div>
    <div class="category">🍔<br>Alimentation</div>
    <div class="category">💄<br>Beauté</div>
  </div>
</section>

<section class="products">

  <h2>🔥 Produits récents</h2>

  <div class="product-grid">

    <div class="product">
      <img src="https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?w=500" alt="Téléphone">

      <div class="product-info">
        <h3>Samsung Galaxy</h3>
        <p class="price">25 000 HTG</p>
        <p class="location">📍 Jacmel</p>

        <a class="contact" href="#">
          💬 Contacter
        </a>
      </div>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=500" alt="Vêtement">

      <div class="product-info">
        <h3>Ensemble homme</h3>
        <p class="price">3 500 HTG</p>
        <p class="location">📍 Jacmel</p>

        <a class="contact" href="#">
          💬 Contacter
        </a>
      </div>
    </div>

  </div>

</section>

<footer>
  © 2026 Lakay Market 🇭🇹
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAKAY MARKET - Mode & Accessoires</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f5f6fa;
      color: #333;
      padding-bottom: 40px;
    }

    header {
      background-color: #1e272e;
      color: white;
      padding: 20px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
      font-style: italic;
      color: #dcdde1;
    }

    .search-container {
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
    }

    .search-bar {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #dcdde1;
      border-radius: 25px;
      font-size: 15px;
      outline: none;
    }

    .categories {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 15px 15px;
      flex-wrap: wrap;
    }

    .cat-btn {
      padding: 8px 16px;
      border: none;
      background-color: #e1b12c;
      color: white;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .cat-btn:hover {
      background-color: #c49b23;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      padding: 15px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .product-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
    }

    .product-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #eaeaea;
    }

    .product-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-category {
      font-size: 11px;
      text-transform: uppercase;
      color: #7f8c8d;
      font-weight: bold;
    }

    .product-title {
      font-size: 15px;
      margin: 5px 0;
      font-weight: 600;
    }

    .product-price {
      font-size: 16px;
      color: #e1b12c;
      font-weight: bold;
      margin-top: auto;
      margin-bottom: 10px;
    }

    .btn-buy {
      background-color: #25D366;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      display: block;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🇭🇹 LAKAY MARKET</h1>
    <p>Achte lakay, vann lakay.</p>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-bar" placeholder="Chercher une tenue, un accessoire..." onkeyup="filterProducts()">
  </div>

  <div class="categories">
    <button class="cat-btn" onclick="filterCategory('all')">Tout</button>
    <button class="cat-btn" onclick="filterCategory('tenue')">Tenues</button>
    <button class="cat-btn" onclick="filterCategory('accessoire')">Accessoires</button>
  </div>

  <div class="products-grid" id="productsGrid">

    <!-- Produit 1 -->
    <div class="product-card" data-category="tenue">
      <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=500" alt="Robe d'été" class="product-img">
      <div class="product-info">
        <span class="product-category">Tenue</span>
        <h3 class="product-title">Robe Élégante d'Été</h3>
        <div class="product-price">2500 HTG</div>
        <a href="https://wa.me/?text=Bonjour,%20je%20suis%20intéressé%20par%20la%20Robe%20Élégante" class="btn-buy" target="_blank">Commander WhatsApp</a>
      </div>
    </div>

    <!-- Produit 2 -->
    <div class="product-card" data-category="accessoire">
      <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Montre" class="product-img">
      <div class="product-info">
        <span class="product-category">Accessoire</span>
        <h3 class="product-title">Montre Moderne Homme</h3>
        <div class="product-price">1800 HTG</div>
        <a href="https://wa.me/?text=Bonjour,%20je%20suis%20intéressé%20par%20la%20Montre%20Moderne" class="btn-buy" target="_blank">Commander WhatsApp</a>
      </div>
    </div>

    <!-- Produit 3 -->
    <div class="product-card" data-category="tenue">
      <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" alt="T-Shirt" class="product-img">
      <div class="product-info">
        <span class="product-category">Tenue</span>
        <h3 class="product-title">T-Shirt Coton Premium</h3>
        <div class="product-price">1200 HTG</div>
        <a href="https://wa.me/?text=Bonjour,%20je%20suis%20intéressé%20par%20le%20T-Shirt%20Coton" class="btn-buy" target="_blank">Commander WhatsApp</a>
      </div>
    </div>

    <!-- Produit 4 -->
    <div class="product-card" data-category="accessoire">
      <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500" alt="Sac à main" class="product-img">
      <div class="product-info">
        <span class="product-category">Accessoire</span>
        <h3 class="product-title">Sac à Main en Cuir</h3>
        <div class="product-price">3200 HTG</div>
        <a href="https://wa.me/?text=Bonjour,%20je%20suis%20intéressé%20par%20le%20Sac%20à%20Main" class="btn-buy" target="_blank">Commander WhatsApp</a>
      </div>
    </div>

  </div>

  <script>
    function filterProducts() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.getElementsByClassName('product-card');

      Array.from(cards).forEach(card => {
        const title = card.querySelector('.product-title').innerText.toLowerCase();
        if (title.includes(input)) {
          card.style.display = "flex";
        } else {
          card.style.display = "none";
        }
      });
    }

    function filterCategory(cat) {
      const cards = document.getElementsByClassName('product-card');
      Array.from(cards).forEach(card => {
        if (cat === 'all' || card.getAttribute('data-category') === cat) {
          card.style.display = "flex";
        } else {
          card.style.display = "none";
        }
      });
    }
  </script>
</body>
</html>
